/* ========== 1. 主题变量（design.md §8.1） ========== */
:root {

  --accent: #FF7EB3;

* { box-sizing: border-box; margin: 0; padding: 0; }

#app {

  padding: 24px 16px;
}

/* 桌面端给顶部 Tab 栏留空间；移动端给底部 Tab 栏 + FAB 留空间 */

}

.fab {

.btn:active { opacity: 0.7; }

/* ========== 10. 深色背景主题变量（星空粉夜等） ========== */
body.bg-dark {

  /* ================= 庆祝与撒花（Step 19） ================= */

  const CONFETTI_COLORS = ['#FF9A9E', '#FF7EB3', '#FECFEF', '#FFF0F5', '#E85D75', '#FFD6E0'];

  function confetti() {
    const canvas = document.createElement('canvas');
    canvas.className = 'confetti';
    document.body.appendChild(canvas);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    const c = canvas.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = window.innerWidth;
    const H = window.innerHeight;
    const pieces = Array.from({ length: 90 }, () => ({
      x: Math.random() * W,
      y: -20 - Math.random() * H * 0.4,
      vy: 60 + Math.random() * 120,
      vx: -30 + Math.random() * 60,
      size: 6 + Math.random() * 10,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      rot: Math.random() * Math.PI * 2,
      vr: -3 + Math.random() * 6,
      heart: Math.random() < 0.5,
    }));
    const t0 = performance.now();
    function frame(ts) {
      const dt = Math.min(0.05, (ts - (frame.lastTs ?? ts)) / 1000);
      frame.lastTs = ts;
      c.clearRect(0, 0, W, H);
      for (const p of pieces) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
        c.save();
        c.translate(p.x, p.y);
        c.rotate(p.rot);
        c.fillStyle = p.color;
        if (p.heart) {
          c.scale(p.size / 16, p.size / 16);
          c.beginPath();
          c.moveTo(0, 5);
          c.bezierCurveTo(-8, -3, -5, -9, 0, -4);
          c.bezierCurveTo(5, -9, 8, -3, 0, 5);
          c.fill();
        } else {
          c.scale(p.size / 16, p.size / 16);
          c.beginPath();
          c.ellipse(0, 0, 8, 5, 0, 0, Math.PI * 2);
          c.fill();
        }
        c.restore();
      }
      if (ts - t0 < 3000) {
        requestAnimationFrame(frame);
      } else {
        canvas.remove();
      }
    }
    requestAnimationFrame(frame);
  }

  async function celebrateIfDue() {

  /* ================= 图片处理（Step 16/20/22 共用） ================= */

  async function decodeImage(file) {
    if (typeof createImageBitmap === 'function') {
      try {
        // 应用 EXIF 方向：手机照片不旋转（implementation.md Step 16）
        return await createImageBitmap(file, { imageOrientation: 'from-image' });
      } catch (e) {
        // 降级到 Image 元素（浏览器解码天然带 EXIF 方向）
      }
    }
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = () => reject(new Error('图片解码失败'));
        img.src = url;
      });
      return img;
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function drawResized(src, maxEdge) {
    const w = src.width || src.naturalWidth;
    const h = src.height || src.naturalHeight;
    const scale = Math.min(1, maxEdge / Math.max(w, h));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(w * scale));
    canvas.height = Math.max(1, Math.round(h * scale));
    canvas.getContext('2d').drawImage(src, 0, 0, canvas.width, canvas.height);
    return canvas;
  }

  function canvasToBlob(canvas) {
    return new Promise((resolve, reject) => {
      canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('压缩失败'))), 'image/jpeg', 0.85);
    });
  }

  async function compressImage(file) {
    const src = await decodeImage(file);
    try {
      const thumb = await canvasToBlob(drawResized(src, 400));
      const full = await canvasToBlob(drawResized(src, 1600));
      return { thumb, full };
    } finally {
      if (src.close) src.close();
    }
  }

  async function compressToDataURL(file, maxEdge) {
    const src = await decodeImage(file);
    try {
      return drawResized(src, maxEdge).toDataURL('image/jpeg', 0.85);
    } finally {
      if (src.close) src.close();
    }
  }

  /* ================= 相册（Step 16~17） ================= */

  function photoList() {
    return [...LM.state.photos].sort((a, b) => b.createdAt - a.createdAt);
  }

  function promptCaption() {
    return new Promise((resolve) => {

      const finish = (v) => {

        closeModal(true);

          <button type="button" class="btn btn-primary" data-action="caption-save">${STRINGS.diarySave}</button>

  async function onPhotoUpload(el) {
    const files = Array.from(el.files || []);
    if (!files.length) return;
    el.value = '';
    let saved = 0;
    for (const file of files) {
      if (!file.type.startsWith('image/')) {
        toast(STRINGS.photoSkippedNonImage);
        continue;
      }
      const caption = await promptCaption();
      try {
        const { thumb, full } = await compressImage(file);
        await putPhotoRecord({
          id: LM.genId('p'),
          thumb,
          full,
          caption,
          date: LM.todayStr(),
          createdAt: Date.now(),
        });
        saved++;
      } catch (e) {
        reportError(e);
        toast(STRINGS.photoFailed);
      }
    }
    await reloadPhotos();
    if (saved) toast(STRINGS.photoUploaded(saved));
  }

    LM.state.photos = await LM.db.getAll('photos');
    render();
  }

  let lightboxUrl = null;

  function revokeLightboxUrl() {
    if (lightboxUrl) {
      URL.revokeObjectURL(lightboxUrl);
      lightboxUrl = null;
    }
  }

  function lightboxInnerHtml(L) {
    const p = L.list[L.idx];

    lightboxUrl = isBlob ? URL.createObjectURL(p.full) : null;
    return `
      <img class="lightbox-img" src="${isBlob ? lightboxUrl : p.full}" alt="">

      </div>`;

  function navLightbox(dir) {
    const L = LM.state.lightbox;
    if (!L) return;
    const idx = L.idx + dir;
    if (idx < 0 || idx >= L.list.length) return;
    L.idx = idx;
    const box = document.querySelector('.lightbox');
    if (box) box.innerHTML = lightboxInnerHtml(L);
  }

  function openLightbox(id) {
    const list = photoList();
    const idx = list.findIndex((p) => p.id === id);
    if (idx < 0) return;
    LM.state.lightbox = { list, idx };
    const onKey = (e) => {
      if (e.key === 'ArrowLeft') navLightbox(-1);
      if (e.key === 'ArrowRight') navLightbox(1);
      if (e.key === 'Escape') closeModal();
    };
    openModal(lightboxInnerHtml(LM.state.lightbox), {
      containerClass: 'lightbox',
      closeOnMask: false,
      onClose: () => {
        revokeLightboxUrl();
        document.removeEventListener('keydown', onKey);
        LM.state.lightbox = null;
      },
    });
    document.addEventListener('keydown', onKey);
    // 触摸左右滑动切换
    const box = document.querySelector('.lightbox');
    let startX = null;
    box.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });
    box.addEventListener('touchend', (e) => {
      if (startX == null) return;
      const dx = e.changedTouches[0].clientX - startX;
      if (dx > 50) navLightbox(-1);
      else if (dx < -50) navLightbox(1);
      startX = null;
    }, { passive: true });

  /* ================= 备份与恢复（Step 23~24） ================= */

  const META_KEYS = ['profile', 'settings', 'lastCelebrated'];

  function blobToDataURL(blob) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.onerror = () => reject(new Error('读取失败'));
      fr.readAsDataURL(blob);
    });
  }

  function dataURLToBlob(dataURL) {
    const [head, b64] = String(dataURL).split(',');
    const mime = (head.match(/data:([^;]+)/) || [, 'application/octet-stream'])[1];
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: mime });
  }

  function isFallback() {
    return LM.db.backend() === 'localStorage';
  }

  /** 写照片记录：IDB 后端存 Blob；降级后端转 dataURL（localStorage 无法存 Blob） */
  async function putPhotoRecord(record) {
    if (isFallback()) {
      await LM.db.put('photos', null, {
        ...record,
        thumb: await blobToDataURL(record.thumb),
        full: await blobToDataURL(record.full),
      });
    } else {
      await LM.db.put('photos', null, record);
    }
  }

  function downloadText(text, filename) {
    const blob = new Blob([text], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function exportData() {
    try {
      toast(STRINGS.exportToast);
      const meta = {};
      for (const k of META_KEYS) {
        const v = await LM.db.get('meta', k);
        if (v != null) meta[k] = v;
      }
      const photos = await Promise.all((await LM.db.getAll('photos')).map(async (p) => ({
        id: p.id,
        caption: p.caption,
        date: p.date,
        createdAt: p.createdAt,
        thumb: p.thumb instanceof Blob ? await blobToDataURL(p.thumb) : p.thumb,
        full: p.full instanceof Blob ? await blobToDataURL(p.full) : p.full,
      })));
      const payload = {
        app: 'lovemark',
        schemaVersion: LM.Validate.SCHEMA_VERSION,
        exportedAt: new Date().toISOString(),
        data: {
          meta,
          diaries: await LM.db.getAll('diaries'),
          photos,
          anniversaries: await LM.db.getAll('anniversaries'),
        },
      };
      const json = JSON.stringify(payload);
      if (json.length > 100 * 1024 * 1024) {
        const ok = await confirmDialog({ message: STRINGS.exportLargeConfirm });
        if (!ok) return;
      }
      downloadText(json, `lovemark-backup-${LM.todayStr().replaceAll('-', '')}.json`);
      toast(STRINGS.exportDone);
    } catch (e) {
      reportError(e);
    }
  }

  async function onImportFile(el) {
    const file = el.files && el.files[0];
    if (!file) return;
    el.value = '';
    let text;
    try {
      text = await file.text();
    } catch (e) {
      toast(STRINGS.importReadFailed);
      return;
    }
    let payload;
    try {
      payload = JSON.parse(text);
    } catch (e) {
      toast(STRINGS.importInvalidJson);
      return;
    }
    const v = LM.Validate.validateImport(payload);
    if (!v.ok) {
      toast(`导入被拒绝：${v.reason}`);
      return;
    }
    LM.state.importPayload = payload;
    openModal(`
      <h3 class="modal-title">导入备份</h3>
      <p class="modal-message">${esc(STRINGS.importChoose)}</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-action="import-cancel">${STRINGS.importCancel}</button>
        <button type="button" class="btn btn-ghost" data-action="import-overwrite">${STRINGS.importOverwrite}</button>
        <button type="button" class="btn btn-primary" data-action="import-merge">${STRINGS.importMerge}</button>
      </div>
    `, { closeOnMask: false });
  }

  /** 导入前快照存入 meta 临时键（不放内存）；降级后端无法序列化 Blob，photos 跳过 */
  async function snapshotCurrent() {
    const snap = {
      profile: await LM.db.get('meta', 'profile'),
      settings: await LM.db.get('meta', 'settings'),
      lastCelebrated: await LM.db.get('meta', 'lastCelebrated'),
      diaries: await LM.db.getAll('diaries'),
      photos: isFallback() ? null : await LM.db.getAll('photos'),
      anniversaries: await LM.db.getAll('anniversaries'),
    };
    await LM.db.put('meta', '__snapshot__', snap);
  }

  async function rollbackFromSnapshot() {
    const snap = await LM.db.get('meta', '__snapshot__');
    if (!snap) return;
    await LM.db.clear('meta');
    await LM.db.clear('diaries');
    await LM.db.clear('photos');
    await LM.db.clear('anniversaries');
    for (const k of META_KEYS) {
      if (snap[k] != null) await LM.db.put('meta', k, snap[k]);
    }
    for (const d of snap.diaries || []) await LM.db.put('diaries', null, d);
    if (snap.photos) for (const p of snap.photos) await LM.db.put('photos', null, p);
    for (const a of snap.anniversaries || []) await LM.db.put('anniversaries', null, a);
  }

  async function runImport(payload, overwrite) {
    const data = payload.data || {};
    try {
      await snapshotCurrent();
      if (overwrite) {
        await LM.db.clear('meta');
        await LM.db.clear('diaries');
        await LM.db.clear('photos');
        await LM.db.clear('anniversaries');
      }
      if (data.meta) {
        for (const k of META_KEYS) {
          if (data.meta[k] != null) await LM.db.put('meta', k, data.meta[k]);
        }
      }
      for (const d of data.diaries || []) await LM.db.put('diaries', null, d);
      for (const a of data.anniversaries || []) await LM.db.put('anniversaries', null, a);
      for (const p of data.photos || []) {
        if (isFallback()) {
          await LM.db.put('photos', null, {
            id: p.id, caption: p.caption, date: p.date, createdAt: p.createdAt,
            thumb: p.thumb, full: p.full,
          });
        } else {
          await LM.db.put('photos', null, {
            id: p.id, caption: p.caption, date: p.date, createdAt: p.createdAt,
            thumb: dataURLToBlob(p.thumb), full: dataURLToBlob(p.full),
          });
        }
      }
      await LM.db.del('meta', '__snapshot__');
    } catch (e) {
      console.error('[爱记] 导入失败，尝试回滚', e);
      try {
        await rollbackFromSnapshot();
        await LM.db.del('meta', '__snapshot__');
        toast(STRINGS.importFailed);
      } catch (e2) {
        console.error('[爱记] 回滚失败', e2);
        toast('导入失败且回滚异常，请尽快从备份文件恢复');
      }
      return;
    }
    await reloadAll();
    toast(STRINGS.importDone);
  }

  async function reloadAll() {
    const st = LM.state;
    st.profile = await LM.db.get('meta', 'profile');
    st.settings = await LM.db.get('meta', 'settings');
    st.diaries = await LM.db.getAll('diaries');
    st.photos = await LM.db.getAll('photos');
    st.anniversaries = await LM.db.getAll('anniversaries');

    const i = LM.state.diaries.findIndex((x) => x.id === record.id);

  /* ================= 事件委托与动作表 ================= */

  function chipRefresh(selector, value) {
    document.querySelectorAll(selector).forEach((c) => c.classList.toggle('chip-on', c.dataset.value === value));
  }

  function saveForm() {
    const f = LM.state.form;
    if (!f) return;
    if (f.type === 'diary') {
      if (!f.content.trim()) {
        toast(STRINGS.diaryContentRequired);
        return;
      }
      if (f.date > LM.todayStr()) {
        toast(STRINGS.wizardDateFuture);
        return;
      }
      f.finish({ mode: 'save', draft: f });
    } else if (f.type === 'anniv') {
      if (!f.name.trim()) {
        toast(STRINGS.annivNameRequired);
        return;
      }
      f.finish({ mode: 'save', draft: f });
    } else if (f.type === 'profile') {
      if (!f.nameA.trim() || !f.nameB.trim()) {
        toast(STRINGS.profileNamesRequired);
        return;
      }
      if (f.startDate > LM.todayStr()) {
        toast(STRINGS.profileDateFuture);
        return;
      }
      const changed = f.startDate !== f.origStartDate;
      if (changed) {
        confirmDialog({ message: STRINGS.profileDateChangeConfirm }).then((ok) => {
          if (ok) f.finish({ mode: 'save', draft: f });
        });
      } else {
        f.finish({ mode: 'save', draft: f });
      }
    }
  }

  async function handleAvatarFile(el) {
    const file = el.files && el.files[0];
    if (!file) return;
    el.value = '';
    if (!file.type.startsWith('image/')) {
      toast(STRINGS.photoSkippedNonImage);
      return;
    }
    try {
      const dataUrl = await compressToDataURL(file, 256);
      const target = el.dataset.target;
      if (LM.state.wizard) {
        LM.state.wizard[target] = dataUrl;
      } else if (LM.state.form) {
        LM.state.form[target] = dataUrl;
      }
      const img = document.querySelector(`[data-preview="${target}"]`);
      if (img) {
        img.hidden = false;
        img.src = dataUrl;
      }
    } catch (e) {
      console.error('[爱记] 头像处理失败', e);
      toast(STRINGS.photoFailed);
    }
  }

  const ACTIONS = {
    'switch-page': (el) => switchPage(el.dataset.page),
    'goto-diary': () => switchPage('diary'),
    'goto-anniv': () => switchPage('anniversaries'),

    // ---- 每日一句（Step 13）----
    'quote-next': () => {
      LM.state.dailyQuote = { index: -1, quote: Quotes.randomQuote() };
      render();
    },

    // ---- 日记（Step 14~15）----
    'diary-new': () => openDiaryForm(null).then(handleDiaryResult),
    'diary-open': (el) => {
      const d = LM.state.diaries.find((x) => x.id === el.dataset.id);
      if (d) openModal(diaryDetailHtml(d), { closeOnMask: true });
    },
    'diary-edit': async (el) => {
      const d = LM.state.diaries.find((x) => x.id === el.dataset.id);
      if (!d) return;
      closeModal(true);
      await openDiaryForm(d).then(handleDiaryResult);
    },
    'diary-remove': async (el) => {
      const d = LM.state.diaries.find((x) => x.id === el.dataset.id);
      if (!d) return;
      const ok = await confirmDialog({ message: STRINGS.diaryDeleteConfirm, danger: true });
      if (!ok) return;
      closeModal(true);
      await LM.db.del('diaries', d.id);
      LM.state.diaries = LM.state.diaries.filter((x) => x.id !== d.id);
      render();
      toast(STRINGS.deleted);
    },
    'filter-mood': (el) => {
      LM.state.filters.mood = el.dataset.mood || null;
      render();
    },
    'filter-search': (el) => {
      LM.state.filters.keyword = el.value;
      renderDiaryResults(); // 只更新结果区，保住输入焦点
    },

    // ---- 表单通用（单表单制）----
    'form-field': (el) => {
      const f = LM.state.form;
      const field = el.dataset.field;
      if (f && field && field in f) f[field] = el.value;
    },
    'form-mood': (el) => {
      if (!LM.state.form) return;
      LM.state.form.mood = el.dataset.value;
      chipRefresh('.mood-chip', el.dataset.value);
    },
    'form-weather': (el) => {
      if (!LM.state.form) return;
      LM.state.form.weather = el.dataset.value;
      chipRefresh('.weather-chip', el.dataset.value);
    },
    'form-type': (el) => {
      if (!LM.state.form) return;
      LM.state.form.type = el.dataset.value;
      chipRefresh('.type-chip', el.dataset.value);
    },
    'form-save': () => saveForm(),
    'form-cancel': () => {
      if (LM.state.form) LM.state.form.finish({ mode: 'cancel' });
    },
    'form-delete': async () => {
      const f = LM.state.form;
      if (!f) return;
      const msg = f.type === 'diary' ? STRINGS.diaryDeleteConfirm : STRINGS.annivDeleteConfirm;
      const ok = await confirmDialog({ message: msg, danger: true });
      if (ok) f.finish({ mode: 'delete', draft: f });
    },

    'photo-prev': () => navLightbox(-1),

    'photo-delete': async () => {
      const L = LM.state.lightbox;
      if (!L) return;
      const p = L.list[L.idx];
      const ok = await confirmDialog({ message: STRINGS.photoDeleteConfirm, danger: true });
      if (!ok) return;
      await LM.db.del('photos', p.id);
      LM.state.photos = LM.state.photos.filter((x) => x.id !== p.id);

      revokeLightboxUrl();
      closeModal(true);
      render();
      toast(STRINGS.deleted);
    },
    'caption-save': () => {
      const ta = document.querySelector('[data-caption-text]');
      const f = LM.state.form;
      // 说明框借用 finish 通道：caption 完成即恢复
      if (ta && f && f.captionFinish) f.captionFinish(ta.value.trim());
    },
    'caption-skip': () => {
      const f = LM.state.form;
      if (f && f.captionFinish) f.captionFinish('');
    },

    // ---- 纪念日（Step 18）----
    'anniv-add': () => openAnnivForm(null, null).then(handleAnnivResult),

    'anniv-template': (el) => {
      const t = ANNIV_TEMPLATES.find((x) => x.key === el.dataset.n);

      const date = t.date(LM.state.profile.startDate);
      openAnnivForm(null, {
        name: t.key === 'year' ? '在一起一周年' : `在一起 ${Number(t.key)} 天`,
        date,
        type: 'anniversary',
      }).then(handleAnnivResult);
    },

    // ---- 向导（Step 11）----
    'wizard-start': () => {
      LM.state.wizard.step = 2;
      render();
    },
    'wizard-field': (el) => {
      const w = LM.state.wizard;
      if (!w) return;
      const field = el.dataset.field;
      w[field] = el.value;
      const nextBtn = document.querySelector('[data-action="wizard-next"]');
      if (nextBtn) {
        if (field === 'nameA' || field === 'nameB') {
          nextBtn.disabled = !(w.nameA.trim() && w.nameB.trim());
        } else if (field === 'startDate') {
          const future = w.startDate > LM.todayStr();
          nextBtn.disabled = future;
          const hint = document.querySelector('#wizard-date-hint');
          if (hint) hint.textContent = future ? STRINGS.wizardDateFuture : '';
        }
      }
    },
    'wizard-avatar': (el) => handleAvatarFile(el),
    'wizard-next': (el) => {
      const w = LM.state.wizard;
      if (!w) return;
      if (w.step === 2) {
        if (!w.nameA.trim() || !w.nameB.trim()) {
          toast(STRINGS.wizardNamesRequired);
          return;
        }
        w.step = 3;
      } else if (w.step === 3) {
        if (w.startDate > LM.todayStr()) {
          toast(STRINGS.wizardDateFuture);
          return;
        }
        w.step = 4;
      }
      render();
    },
    'wizard-back': () => {
      const w = LM.state.wizard;
      if (!w || w.step <= 2) return;
      w.step--;
      render();
    },
    'wizard-bg-select': (el) => {
      const w = LM.state.wizard;
      if (!w) return;
      w.bgId = el.dataset.bg;
      const preset = BG_PRESETS.find((p) => p.id === w.bgId);
      document.body.classList.remove('bg-dark');
      document.body.style.background = `${preset.css} fixed`;
      if (preset.dark) document.body.classList.add('bg-dark');
      render();
    },
    'wizard-bg-skip': () => {
      LM.state.wizard.bgId = 'preset-1';
      finishWizard();
    },
    'wizard-finish': () => finishWizard(),

    // ---- 设置页（Step 20/22）----
    'bg-select': async (el) => {
      const s = LM.state.settings;
      if (!s) return;
      s.bgType = 'preset';
      s.bgValue = el.dataset.bg;
      await LM.db.put('meta', 'settings', s);
      applyBackground();
      render();
      toast(STRINGS.bgChanged);
    },

      const file = el.files && el.files[0];

      if (!file.type.startsWith('image/')) {
        toast(STRINGS.photoSkippedNonImage);
        return;

        const dataUrl = await compressToDataURL(file, 1920);
        const s = LM.state.settings;
        s.bgType = 'custom';
        s.bgValue = dataUrl;
        await LM.db.put('meta', 'settings', s);
        applyBackground();
        render();
        toast(STRINGS.bgChanged);
      } catch (e) {
        console.error('[爱记] 背景处理失败', e);
        toast(STRINGS.photoFailed);
      }
    },

      const s = LM.state.settings;
      s.particles = !s.particles;

      if (s.particles) LM.particles.start();
      else LM.particles.stop();
      render();
      toast(s.particles ? STRINGS.settingsParticlesOn : STRINGS.settingsParticlesOff);
    },
    'backup-soon': () => toast(STRINGS.settingsBackupSoon),
    'export-data': () => exportData(),
    'import-data': (el) => onImportFile(el),
    'import-cancel': () => {
      LM.state.importPayload = null;
      closeModal(true);
    },
    'import-merge': () => {
      const p = LM.state.importPayload;
      LM.state.importPayload = null;
      closeModal(true);
      if (p) runImport(p, false);
    },

      const p = LM.state.importPayload;
      LM.state.importPayload = null;
      closeModal(true);
      if (p) runImport(p, true);
    },
    'clear-data': async () => {
      const ok1 = await confirmDialog({ message: STRINGS.clearDataConfirm1, danger: true });
      if (!ok1) return;
      const ok2 = await confirmDialog({ message: STRINGS.clearDataConfirm2, danger: true });
      if (!ok2) return;
      await LM.db.clear('meta');
      await LM.db.clear('diaries');
      await LM.db.clear('photos');
      await LM.db.clear('anniversaries');
      LM.state.profile = null;
      LM.state.settings = null;
      LM.state.diaries = [];
      LM.state.photos = [];
      LM.state.anniversaries = [];
      document.body.style.background = '';
      showWizard();
      toast(STRINGS.clearDone);
    },
    'profile-edit': () => openProfileForm().then(handleProfileResult),
  };

  function dispatch(e) {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const fn = ACTIONS[el.dataset.action];
    if (!fn) return;
    if (LM.isDebug) console.log('[爱记][action]', el.dataset.action);
    try {
      const r = fn(el, e);
      if (r && typeof r.catch === 'function') {
        r.catch((err) => {
          console.error('[爱记] 动作失败', el.dataset.action, err);
          reportError(err);
        });
      }
    } catch (err) {
      console.error('[爱记] 动作失败', el.dataset.action, err);
      reportError(err);
    }
  }

  /** 统一错误提示：配额超限给专属文案（design.md §10） */
  function reportError(e) {
    console.error('[爱记]', e);
    if (e && (e.name === 'QuotaExceededError' || (e.message && e.message.toLowerCase().includes('quota')))) {
      toast(STRINGS.quotaExceeded);
    } else {
      toast(STRINGS.errorGeneric);
    }
  }

  /* ================= Toast（队列，2.5s/条，design.md §7.4） ================= */

  const toastQueue = [];
  let toastShowing = false;

  function toast(message) {
    toastQueue.push(String(message));
    pumpToast();
  }

  function pumpToast() {
    if (toastShowing || toastQueue.length === 0) return;
    toastShowing = true;
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = toastQueue.shift(); // textContent 天然免疫 HTML
    document.querySelector('#toasts').appendChild(el);
    setTimeout(() => {
      el.classList.add('toast-out');
      setTimeout(() => {
        el.remove();
        toastShowing = false;
        pumpToast();
      }, 250);
    }, 2500);
  }

  /* ================= 通用弹窗与确认框 ================= */

  let activeModal = null;

  function lockScroll(lock) {
    document.body.style.overflow = lock ? 'hidden' : '';
  }

  function openModal(html, opts = {}) {
    const { closeOnMask = true, onClose = null, containerClass = 'modal' } = opts;
    if (activeModal) activeModal.close(true);
    const ov = document.querySelector('#overlay');
    ov.hidden = false;
    ov.innerHTML = `
      <div class="modal-mask" data-modal-mask></div>
      <div class="${containerClass}" role="dialog">${html}</div>`;
    lockScroll(true);
    activeModal = {
      closeOnMask,
      onClose,
      close(silent) {
        ov.hidden = true;
        ov.innerHTML = '';
        lockScroll(false);
        activeModal = null;
        if (!silent && onClose) onClose();
      },
    };
    ov.querySelector('[data-modal-mask]').addEventListener('click', () => {
      if (activeModal && activeModal.closeOnMask) activeModal.close();
    });
    return activeModal;
  }

  function closeModal(silent = false) {
    if (activeModal) activeModal.close(silent);
  }

  function confirmDialog(opts = {}) {
    const title = opts.title ?? STRINGS.confirmTitle;
    const message = opts.message ?? '';
    const confirmText = opts.confirmText ?? STRINGS.confirmOk;
    const cancelText = opts.cancelText ?? STRINGS.confirmCancel;
    const danger = !!opts.danger;
    return new Promise((resolve) => {
      let settled = false;
      const finish = (v) => {
        if (settled) return;
        settled = true;
        closeModal(true);
        resolve(v);
      };
      openModal(`
        <h3 class="modal-title">${esc(title)}</h3>
        <p class="modal-message">${esc(message)}</p>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-action="confirm-cancel">${esc(cancelText)}</button>
          <button type="button" class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-action="confirm-ok">${esc(confirmText)}</button>
        </div>
      `, {
        closeOnMask: false,
        onClose: () => finish(false), // 被外部程序关闭 → 视为取消
      });
      const ov = document.querySelector('#overlay');
      ov.querySelector('[data-action="confirm-ok"]').addEventListener('click', () => finish(true));
      ov.querySelector('[data-action="confirm-cancel"]').addEventListener('click', () => finish(false));
    });
  }

  /* ================= 启动 ================= */

  function init() {
    // 事件委托绑一次；首帧渲染由 main.js 的 showWizard()/startApp() 触发
    ['click', 'change', 'input'].forEach((evt) => {
      document.addEventListener(evt, dispatch);
    });
    // 全局兜底（tech-stack.md §9）：错误可见、页面不白屏
    window.addEventListener('error', (e) => {
      console.error('[爱记] 未捕获错误', e.error || e.message);
      toast(STRINGS.errorGeneric);
    });
    window.addEventListener('unhandledrejection', (e) => {
      console.error('[爱记] 未处理的 Promise 拒绝', e.reason);
      toast(STRINGS.errorGeneric);
    });
  }

  /** 降级存储常驻横幅（Step 25；main.js 检测到 localStorage 后端时调用） */
  function showFallbackBanner() {
    if (document.querySelector('.fallback-banner')) return;
    const el = document.createElement('div');
    el.className = 'fallback-banner';
    el.textContent = STRINGS.fallbackBanner;
    document.body.prepend(el);
    document.body.classList.add('show-banner');
  }

  const ui = {
    init,
    render,
    switchPage,
    esc,
    toast,
    openModal,
    closeModal,
    confirm: confirmDialog,
    startApp,
    showWizard,
    applyBackground,
    reportError,
    showFallbackBanner,
    STRINGS,
  };

  global.LM.ui = ui;
})(typeof window !== 'undefined' ? window : globalThis);

/**
 * particles.js —— Canvas 爱心花瓣粒子（design.md §8.4，Step 21）
 * 约 15 粒子/秒缓落；全屏透明 Canvas（pointer-events: none），不挡任何交互。
 * 页面隐藏时 rAF 被浏览器自动暂停，无需额外处理。
 */
(function (global) {
  'use strict';

  const COLORS = ['#FF9A9E', '#FF7EB3', '#FECFEF', '#FFC3D8', '#FFD6E0'];
  const SPAWN_PER_SEC = 15;

  let canvas = null;
  let ctx = null;
  let rafId = null;
  let running = false;
  let pieces = [];
  let spawnAcc = 0;
  let last = null;

  function ensureCanvas() {
    if (canvas) return;
    canvas = document.createElement('canvas');
    canvas.className = 'particles';
    document.body.appendChild(canvas);
    resize();
    window.addEventListener('resize', resize);
  }

  function resize() {
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function spawnOne() {
    pieces.push({
      x: Math.random() * window.innerWidth,
      y: -24,
      vy: 18 + Math.random() * 28, // 像素/秒
      vx: -8 + Math.random() * 16,
      size: 6 + Math.random() * 8,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      rot: Math.random() * Math.PI * 2,
      vr: -1 + Math.random() * 2, // 弧度/秒
      heart: Math.random() < 0.5,
    });
  }

  function drawHeart(c, p) {
    c.save();
    c.translate(p.x, p.y);
    c.rotate(p.rot);
    c.scale(p.size / 16, p.size / 16);
    c.fillStyle = p.color;
    c.beginPath();
    c.moveTo(0, 5);
    c.bezierCurveTo(-8, -3, -5, -9, 0, -4);
    c.bezierCurveTo(5, -9, 8, -3, 0, 5);
    c.fill();
    c.restore();
  }

  function drawPetal(c, p) {
    c.save();
    c.translate(p.x, p.y);
    c.rotate(p.rot);
    c.scale(p.size / 16, p.size / 16);
    c.fillStyle = p.color;
    c.beginPath();
    c.ellipse(0, 0, 8, 5, 0, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }

  function frame(ts) {
    if (!running) return;
    if (last == null) last = ts;
    const dt = Math.min(0.1, (ts - last) / 1000);
    last = ts;

    spawnAcc += SPAWN_PER_SEC * dt;
    while (spawnAcc >= 1) {
      spawnOne();
      spawnAcc -= 1;
    }

    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      if (p.y > window.innerHeight + 40) {
        pieces.splice(i, 1);
        continue;
      }
      if (p.heart) drawHeart(ctx, p);
      else drawPetal(ctx, p);
    }
    rafId = requestAnimationFrame(frame);
  }

  function start() {
    if (running) return;
    ensureCanvas();
    running = true;
    last = null;
    rafId = requestAnimationFrame(frame);
  }

  function stop() {
    running = false;
    if (rafId != null) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
    if (canvas) {
      canvas.remove();
      window.removeEventListener('resize', resize);
      canvas = null;
      ctx = null;
    }
    pieces = [];
    spawnAcc = 0;
  }

  global.LM = global.LM || {};
  global.LM.particles = { start, stop, running: () => running };
})(typeof window !== 'undefined' ? window : globalThis);

/**
 * main.js —— 启动编排
 * 流程：打开存储 → 读 meta（profile/settings）→ 有 profile 则加载各列表并进入应用，
 *       无 profile 则进入初始化向导（Step 11）。
 */
(function (global) {
  'use strict';

  console.log('[爱记] 构建成功');

  async function bootstrap() {
    const db = global.LM.db;
    const state = global.LM.state;
    try {
      await db.open();
    } catch (e) {
      console.error('[爱记] 存储初始化失败', e);
    }
    state.profile = await db.get('meta', 'profile');
    state.settings = await db.get('meta', 'settings');
    if (state.profile) {
      state.diaries = await db.getAll('diaries');
      state.photos = await db.getAll('photos');
      state.anniversaries = await db.getAll('anniversaries');
      state.dailyQuote = global.LM.Quotes.quoteForDate(global.LM.todayStr());
    }
    global.LM.ui.init();
    if (global.LM.db.backend() === 'localStorage') {
      global.LM.ui.showFallbackBanner();
    }
    if (!state.profile) {
      global.LM.ui.showWizard();
    } else {
      global.LM.ui.startApp();
    }
  }

  // 守卫：模块加载期不得访问 DOM（Node 冒烟可加载；浏览器在 DOMContentLoaded 后启动）
  if (typeof document !== 'undefined') {
    document.addEventListener('DOMContentLoaded', () => {
      bootstrap().catch((e) => console.error('[爱记] 启动失败', e));
    });
  }
})(typeof window !== 'undefined' ? window : globalThis);

  </script>
</body>
